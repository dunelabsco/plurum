[tool.poetry]
name = "plurum"
version = "0.2.0"
description = "The collective intelligence layer for AI agents"
authors = ["Plurum Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.138,<0.157"
anyio = ">=4.14.2,<5.0.0"
certifi = ">=2026.10.19"
uvicorn = {extras = ["standard"], version = ">=0.31.1,<1.0.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
supabase = "^2.3.0"
openai = "^1.10.0"
httpx = ">=0.27.1,<1.0.0"
multidict = ">=6.9.1,<8.0.0"
slowapi = "^0.1.9"
limits = ">=5.8,<6.0"
mcp = ">=1.30.0,<2.0.0"
pyjwt = {extras = ["crypto"], version = ">=2.15.1,<3.0.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.0.0"
httpx = ">=0.27.1,<1.0.0"
ruff = ">=0.1,<0.18"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
