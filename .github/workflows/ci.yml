name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plurum_registration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plurum_registration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_DB_URL: postgresql://localhost/test
      SUPABASE_KEY: test-key
      OPENAI_API_KEY: test-key
      ENVIRONMENT: development
      PLURUM_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/plurum_registration_test
      PLURUM_ALLOW_DESTRUCTIVE_POSTGRES_TEST: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Lint
        run: poetry run ruff check app tests
      - name: Run backend and Hermes plugin tests
        run: poetry run pytest tests plugins/hermes/tests -q
      - name: Build production image
        run: docker build --tag plurum-ci .

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  openclaw:
    name: openclaw plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/openclaw
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/openclaw/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify tracked dist
        run: git diff --exit-code -- dist

  plurum-cli:
    name: plurum cli (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: macos-latest
            node: "22"
          - os: windows-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
    defaults:
      run:
        working-directory: packages/plurum-cli
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/plurum-cli/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test, build, and verify package
        run: npm run check

  native-credential-abi:
    name: native credential ABI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
            target: darwin-arm64
            rust_host: aarch64-apple-darwin
          - os: macos-15-intel
            architecture: x64
            target: darwin-x64
            rust_host: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            architecture: arm64
            target: linux-arm64-gnu
            rust_host: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            architecture: x64
            target: linux-x64-gnu
            rust_host: x86_64-unknown-linux-gnu
          - os: windows-2025
            architecture: x64
            target: win32-x64-msvc
            rust_host: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: packages/plurum-cli
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          architecture: ${{ matrix.architecture }}
      - name: Prepare isolated native test paths
        run: node native/credential-store/tests/prepare-isolation.mjs
        env:
          PLURUM_NATIVE_ISOLATION_ROOT: ${{ runner.temp }}/plurum-native-isolation
          PLURUM_NATIVE_RUST_HOST: ${{ matrix.rust_host }}
      - name: Install npm dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the unwired CLI package
        run: npm run check
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Install the opposite macOS Rust target on arm64
        if: matrix.target == 'darwin-arm64' && runner.os == 'macOS' && runner.arch == 'ARM64'
        run: rustup target add --toolchain 1.97.1-aarch64-apple-darwin x86_64-apple-darwin
      - name: Install the opposite macOS Rust target on x64
        if: matrix.target == 'darwin-x64' && runner.os == 'macOS' && runner.arch == 'X64'
        run: rustup target add --toolchain 1.97.1-x86_64-apple-darwin aarch64-apple-darwin
      - name: Fetch locked Rust dependencies
        run: node native/credential-store/tests/run-isolated-cargo.mjs fetch
      - name: Verify locked Rust metadata and features
        run: node native/credential-store/tests/metadata-conformance.mjs
      - name: Install the declared minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check the declared Rust minimum
        run: node native/credential-store/tests/run-isolated-cargo.mjs msrv
      - name: Check Rust formatting
        run: node native/credential-store/tests/run-isolated-cargo.mjs fmt
      - name: Lint the native foundation
        run: node native/credential-store/tests/run-isolated-cargo.mjs clippy
      - name: Test the native foundation
        run: node native/credential-store/tests/run-isolated-cargo.mjs test
      - name: Build the disposable native process evidence
        run: node native/credential-store/tests/run-isolated-cargo.mjs process-evidence-build
        env:
          PLURUM_NATIVE_PROCESS_EVIDENCE: github-five-row-universal-macos-build-v1
      - name: Verify disposable native process evidence on POSIX
        if: matrix.target != 'win32-x64-msvc'
        run: node native/credential-store/tests/run-isolated-cargo.mjs process-evidence-run
        env:
          PLURUM_NATIVE_PROCESS_EVIDENCE: github-posix-universal-macos-run-v1
      - name: Build the test-only Windows launchers
        if: matrix.target == 'win32-x64-msvc'
        run: node native/credential-store/tests/run-isolated-cargo.mjs launcher
      - name: Verify native Windows runtime and process evidence
        if: matrix.target == 'win32-x64-msvc' && runner.environment == 'github-hosted'
        shell: pwsh
        env:
          PLURUM_WINDOWS_PROCESS_EVIDENCE: github-windows-process-run-v1
          PLURUM_WINDOWS_RUNTIME_EVIDENCE: github-windows-2025-x64-v1
        run: |
          $ErrorActionPreference = "Stop"
          if (
            $env:CI -cne "true" -or
            $env:GITHUB_ACTIONS -cne "true" -or
            $env:GITHUB_REPOSITORY -cne "dunelabsco/plurum" -or
            $env:RUNNER_OS -cne "Windows" -or
            $env:RUNNER_ARCH -cne "X64" -or
            $env:RUNNER_ENVIRONMENT -cne "github-hosted" -or
            $env:PLURUM_NATIVE_RUST_HOST -cne "x86_64-pc-windows-msvc" -or
            $env:PLURUM_WINDOWS_PROCESS_EVIDENCE -cne "github-windows-process-run-v1" -or
            $env:PLURUM_NATIVE_PROCESS_EVIDENCE_SENTINEL -cne "plurum-native-process-evidence-run-v1" -or
            $env:PLURUM_WINDOWS_RUNTIME_EVIDENCE -cne "github-windows-2025-x64-v1"
          ) {
            throw "Windows runtime evidence is restricted to the exact GitHub Actions row"
          }

          function Get-ValidatedDescendantItem {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$Candidate,
              [Parameter(Mandatory = $true)][bool]$Directory,
              [Parameter(Mandatory = $true)][string]$Label
            )

            $rootItem = Get-Item -LiteralPath $Root -Force
            if (
              -not $rootItem.PSIsContainer -or
              ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
            ) {
              throw "$Label root is invalid"
            }
            $candidateFullPath = [IO.Path]::GetFullPath($Candidate)
            $relativePath = [IO.Path]::GetRelativePath(
              $rootItem.FullName,
              $candidateFullPath
            )
            if (
              [IO.Path]::IsPathRooted($relativePath) -or
              $relativePath -eq "." -or
              $relativePath -eq ".." -or
              $relativePath.StartsWith("..\", [StringComparison]::Ordinal) -or
              $relativePath.StartsWith("../", [StringComparison]::Ordinal)
            ) {
              throw "$Label escaped its required root"
            }

            $current = $rootItem.FullName
            $components = $relativePath.Split(
              [char[]]@("\", "/"),
              [StringSplitOptions]::RemoveEmptyEntries
            )
            if ($components.Count -eq 0) {
              throw "$Label has no descendant components"
            }
            $item = $null
            foreach ($component in $components) {
              if ($component -eq "." -or $component -eq "..") {
                throw "$Label contains a traversal component"
              }
              $current = Join-Path $current $component
              $item = Get-Item -LiteralPath $current -Force
              if (
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
              ) {
                throw "$Label contains a reparse point"
              }
            }
            if (
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                $item.FullName,
                $candidateFullPath
              ) -or
              $item.PSIsContainer -ne $Directory
            ) {
              throw "$Label has the wrong object kind or path"
            }
            return $item
          }

          function Assert-ArtifactHash {
            param(
              [Parameter(Mandatory = $true)]$Item,
              [Parameter(Mandatory = $true)][string]$Expected,
              [Parameter(Mandatory = $true)][string]$Label
            )

            if ($Expected -cnotmatch "^[0-9a-f]{64}$") {
              throw "$Label expected hash is invalid"
            }
            $actual = (Get-FileHash `
              -LiteralPath $Item.FullName `
              -Algorithm SHA256).Hash
            if (
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                $actual,
                $Expected
              )
            ) {
              throw "$Label hash changed"
            }
          }

          function Assert-TrustedProcessEvidenceAcl {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$AccountSid
            )

            $acl = Get-Acl -LiteralPath $Path
            $ownerSid = ([Security.Principal.NTAccount]::new(
              $acl.Owner
            )).Translate(
              [Security.Principal.SecurityIdentifier]
            ).Value
            if ($ownerSid -cne $AccountSid -or -not $acl.AreAccessRulesProtected) {
              throw "protected process-evidence ownership is invalid"
            }

            $allowedSids = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::Ordinal
            )
            [void]$allowedSids.Add($AccountSid)
            [void]$allowedSids.Add("S-1-5-18")
            [void]$allowedSids.Add("S-1-5-32-544")
            $observedSids = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::Ordinal
            )
            $rules = $acl.GetAccessRules(
              $true,
              $true,
              [Security.Principal.SecurityIdentifier]
            )
            foreach ($rule in $rules) {
              $sid = $rule.IdentityReference.Value
              if (
                $rule.IsInherited -or
                $rule.AccessControlType -ne
                  [Security.AccessControl.AccessControlType]::Allow -or
                ($rule.FileSystemRights -band
                  [Security.AccessControl.FileSystemRights]::FullControl) -ne
                  [Security.AccessControl.FileSystemRights]::FullControl -or
                -not $allowedSids.Contains($sid)
              ) {
                throw "protected process-evidence ACL grants an unexpected principal"
              }
              [void]$observedSids.Add($sid)
            }
            if (
              $observedSids.Count -ne $allowedSids.Count -or
              $allowedSids.Where({ -not $observedSids.Contains($_) }).Count -ne 0
            ) {
              throw "protected process-evidence ACL is incomplete"
            }
          }

          function Assert-RuntimeIdentityEvidenceAcl {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$AccountSid
            )

            $acl = Get-Acl -LiteralPath $Path
            $ownerSid = ([Security.Principal.NTAccount]::new(
              $acl.Owner
            )).Translate(
              [Security.Principal.SecurityIdentifier]
            ).Value
            if (
              $ownerSid -cne "S-1-5-32-544" -or
              -not $acl.AreAccessRulesProtected
            ) {
              throw "runtime-identity evidence ownership is invalid"
            }

            $rules = @(
              $acl.GetAccessRules(
                $true,
                $true,
                [Security.Principal.SecurityIdentifier]
              )
            )
            if ($rules.Count -ne 3) {
              throw "runtime-identity evidence ACL has an unexpected rule count"
            }
            $allowedSids = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::Ordinal
            )
            [void]$allowedSids.Add($AccountSid)
            [void]$allowedSids.Add("S-1-5-18")
            [void]$allowedSids.Add("S-1-5-32-544")
            $observedSids = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::Ordinal
            )
            $mutatingRights =
              [Security.AccessControl.FileSystemRights]::WriteData -bor
              [Security.AccessControl.FileSystemRights]::AppendData -bor
              [Security.AccessControl.FileSystemRights]::WriteExtendedAttributes -bor
              [Security.AccessControl.FileSystemRights]::WriteAttributes -bor
              [Security.AccessControl.FileSystemRights]::Delete -bor
              [Security.AccessControl.FileSystemRights]::DeleteSubdirectoriesAndFiles -bor
              [Security.AccessControl.FileSystemRights]::ChangePermissions -bor
              [Security.AccessControl.FileSystemRights]::TakeOwnership
            foreach ($rule in $rules) {
              $sid = $rule.IdentityReference.Value
              if (
                $rule.IsInherited -or
                $rule.AccessControlType -ne
                  [Security.AccessControl.AccessControlType]::Allow -or
                -not $allowedSids.Contains($sid)
              ) {
                throw "runtime-identity evidence ACL grants an unexpected principal"
              }
              if ($sid -ceq $AccountSid) {
                if (
                  ($rule.FileSystemRights -band
                    [Security.AccessControl.FileSystemRights]::ReadAndExecute) -ne
                    [Security.AccessControl.FileSystemRights]::ReadAndExecute -or
                  ($rule.FileSystemRights -band $mutatingRights) -ne 0
                ) {
                  throw "runtime-identity evidence account rights are unsafe"
                }
              }
              elseif (
                ($rule.FileSystemRights -band
                  [Security.AccessControl.FileSystemRights]::FullControl) -ne
                  [Security.AccessControl.FileSystemRights]::FullControl
              ) {
                throw "runtime-identity evidence administrator rights are incomplete"
              }
              [void]$observedSids.Add($sid)
            }
            if (
              $observedSids.Count -ne $allowedSids.Count -or
              $allowedSids.Where({ -not $observedSids.Contains($_) }).Count -ne 0
            ) {
              throw "runtime-identity evidence ACL is incomplete"
            }
          }

          function Get-RuntimeIdentityEvidenceCleanupTree {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$IsolationRoot,
              [Parameter(Mandatory = $true)][string]$CleanupToken,
              [Parameter(Mandatory = $true)][string]$ExpectedProbeHash,
              [Parameter(Mandatory = $true)][long]$ExpectedProbeSize,
              [Parameter(Mandatory = $true)][string]$AccountSid
            )

            $rootItem = Get-ValidatedDescendantItem `
              -Root $IsolationRoot `
              -Candidate $Path `
              -Directory $true `
              -Label "runtime-identity evidence cleanup root"
            if (
              [IO.Path]::GetFileName($rootItem.FullName) -cne
                "windows-runtime-identity" -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetDirectoryName($rootItem.FullName),
                $IsolationRoot
              )
            ) {
              throw "runtime-identity evidence cleanup root is invalid"
            }

            $expectedNames = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::OrdinalIgnoreCase
            )
            [void]$expectedNames.Add("runtime-identity-probe.exe")
            [void]$expectedNames.Add(
              ".plurum-windows-runtime-identity-cleanup"
            )
            $children = @(
              Get-ChildItem `
                -LiteralPath $rootItem.FullName `
                -Force `
                -ErrorAction Stop
            )
            if ($children.Count -ne $expectedNames.Count) {
              throw "runtime-identity evidence tree contains unexpected entries"
            }
            foreach ($child in $children) {
              if (
                $child.PSIsContainer -or
                ($child.Attributes -band
                  [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                -not $expectedNames.Contains($child.Name)
              ) {
                throw "runtime-identity evidence tree contains an unsafe entry"
              }
            }

            $probeItem = Get-ValidatedDescendantItem `
              -Root $rootItem.FullName `
              -Candidate (Join-Path `
                $rootItem.FullName `
                "runtime-identity-probe.exe") `
              -Directory $false `
              -Label "runtime-identity evidence cleanup probe"
            $markerItem = Get-ValidatedDescendantItem `
              -Root $rootItem.FullName `
              -Candidate (Join-Path `
                $rootItem.FullName `
                ".plurum-windows-runtime-identity-cleanup") `
              -Directory $false `
              -Label "runtime-identity evidence cleanup marker"
            if ($probeItem.Length -ne $ExpectedProbeSize) {
              throw "runtime-identity evidence probe size changed"
            }
            Assert-ArtifactHash `
              -Item $probeItem `
              -Expected $ExpectedProbeHash `
              -Label "runtime-identity evidence cleanup probe"
            $expectedMarker =
              "plurum-windows-runtime-identity-cleanup-v1`n$CleanupToken`n"
            if (
              [IO.File]::ReadAllText($markerItem.FullName) -cne
                $expectedMarker
            ) {
              throw "runtime-identity evidence cleanup marker changed"
            }
            foreach ($item in @($rootItem, $probeItem, $markerItem)) {
              Assert-RuntimeIdentityEvidenceAcl `
                -Path $item.FullName `
                -AccountSid $AccountSid
            }

            return [PSCustomObject]@{
              Root = $rootItem
              Probe = $probeItem
              Marker = $markerItem
            }
          }

          function Get-ExactCimProcess {
            param(
              [Parameter(Mandatory = $true)][uint32]$ProcessId,
              [Parameter(Mandatory = $true)][datetime]$CreationDate
            )

            $matches = @(
              Get-CimInstance `
                -ClassName Win32_Process `
                -Filter "ProcessId = $ProcessId" `
                -Property ProcessId,CreationDate,Name `
                -OperationTimeoutSec 2 `
                -ErrorAction Stop |
                  Where-Object { $_.CreationDate -eq $CreationDate }
            )
            if ($matches.Count -gt 1) {
              throw "CIM returned duplicate process identities"
            }
            if ($matches.Count -eq 1) {
              return $matches[0]
            }
            return $null
          }

          function Get-DisposableAccountProcessScan {
            param(
              [Parameter(Mandatory = $true)][string]$AccountSid,
              [Parameter(Mandatory = $true)]$Clock,
              [Parameter(Mandatory = $true)][int]$TimeoutMilliseconds
            )

            $expectedOwnerSid =
              [Security.Principal.SecurityIdentifier]::new($AccountSid)
            if ($Clock.ElapsedMilliseconds -ge $TimeoutMilliseconds) {
              throw "disposable-account process scan exceeded its bound"
            }
            $snapshot = @(
              Get-CimInstance `
                -ClassName Win32_Process `
                -Property ProcessId,CreationDate,Name `
                -OperationTimeoutSec 2 `
                -ErrorAction Stop
            )
            $stable = $true
            $ownedCount = 0
            foreach ($candidate in $snapshot) {
              if ($candidate.ProcessId -eq 0) {
                continue
              }
              if ($Clock.ElapsedMilliseconds -ge $TimeoutMilliseconds) {
                throw "disposable-account process scan exceeded its bound"
              }
              $exact = Get-ExactCimProcess `
                -ProcessId $candidate.ProcessId `
                -CreationDate $candidate.CreationDate
              if ($null -eq $exact) {
                $stable = $false
                continue
              }
              try {
                $owner = Invoke-CimMethod `
                  -InputObject $exact `
                  -MethodName GetOwnerSid `
                  -OperationTimeoutSec 2 `
                  -ErrorAction Stop
              }
              catch {
                if (
                  $null -ne (
                    Get-ExactCimProcess `
                      -ProcessId $candidate.ProcessId `
                      -CreationDate $candidate.CreationDate
                  )
                ) {
                  throw
                }
                $stable = $false
                continue
              }
              if ($owner.ReturnValue -ne 0) {
                if (
                  $null -ne (
                    Get-ExactCimProcess `
                      -ProcessId $candidate.ProcessId `
                      -CreationDate $candidate.CreationDate
                  )
                ) {
                  throw "GetOwnerSid failed for a live process"
                }
                $stable = $false
                continue
              }
              if (
                $null -eq (
                  Get-ExactCimProcess `
                    -ProcessId $candidate.ProcessId `
                    -CreationDate $candidate.CreationDate
                )
              ) {
                $stable = $false
                continue
              }
              try {
                if ([string]::IsNullOrWhiteSpace([string]$owner.Sid)) {
                  throw "GetOwnerSid returned an empty SID"
                }
                $ownerSid =
                  [Security.Principal.SecurityIdentifier]::new(
                    [string]$owner.Sid
                  )
              }
              catch {
                if (
                  $null -ne (
                    Get-ExactCimProcess `
                      -ProcessId $candidate.ProcessId `
                      -CreationDate $candidate.CreationDate
                  )
                ) {
                  throw "GetOwnerSid returned an invalid SID for a live process"
                }
                $stable = $false
                continue
              }
              if ($ownerSid.Equals($expectedOwnerSid)) {
                $ownedCount++
              }
            }
            return [PSCustomObject]@{
              Stable = $stable
              OwnedCount = $ownedCount
            }
          }

          function Disable-And-ProveDisposableAccountQuiescent {
            param(
              [Parameter(Mandatory = $true)][string]$AccountSid,
              [Parameter(Mandatory = $true)][string]$AccountName,
              [int]$TimeoutMilliseconds = 60000
            )

            $sid = [Security.Principal.SecurityIdentifier]::new($AccountSid)
            $account = Get-LocalUser -SID $sid -ErrorAction Stop
            if ($account.Name -cne $AccountName) {
              throw "disposable-account SID no longer names the expected user"
            }
            if ($account.Enabled) {
              Disable-LocalUser -SID $sid -ErrorAction Stop
            }
            $disabled = Get-LocalUser -SID $sid -ErrorAction Stop
            if ($disabled.Name -cne $AccountName -or $disabled.Enabled) {
              throw "disposable account did not become disabled"
            }

            $clock = [Diagnostics.Stopwatch]::StartNew()
            $stableEmptyScans = 0
            while ($clock.ElapsedMilliseconds -lt $TimeoutMilliseconds) {
              $scan = Get-DisposableAccountProcessScan `
                -AccountSid $AccountSid `
                -Clock $clock `
                -TimeoutMilliseconds $TimeoutMilliseconds
              if ($scan.Stable -and $scan.OwnedCount -eq 0) {
                $stableEmptyScans++
                if ($stableEmptyScans -eq 2) {
                  return
                }
              }
              else {
                $stableEmptyScans = 0
              }
              Start-Sleep -Milliseconds 100
            }
            throw "disposable-account processes did not quiesce within the bound"
          }

          function Assert-ProcessEvidenceCleanupRoot {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$FixedDriveRoot,
              [Parameter(Mandatory = $true)][string]$CleanupToken
            )

            $item = Get-Item -LiteralPath $Path -Force
            if (
              -not $item.PSIsContainer -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              [IO.Path]::GetFileName($item.FullName) -cne "plurum-native-isolation" -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetDirectoryName($item.FullName),
                $FixedDriveRoot
              )
            ) {
              throw "protected process-evidence cleanup root is invalid"
            }
            $isolationMarkerItem = Get-ValidatedDescendantItem `
              -Root $item.FullName `
              -Candidate (Join-Path $item.FullName ".plurum-native-isolation") `
              -Directory $false `
              -Label "protected isolation marker"
            if (
              [IO.File]::ReadAllText($isolationMarkerItem.FullName) -cne
                "plurum-native-isolation-v1`n"
            ) {
              throw "protected isolation marker changed"
            }
            $cleanupMarkerItem = Get-ValidatedDescendantItem `
              -Root $item.FullName `
              -Candidate (Join-Path $item.FullName ".plurum-native-process-evidence-cleanup") `
              -Directory $false `
              -Label "protected cleanup marker"
            $expectedCleanupMarker =
              "plurum-native-process-evidence-cleanup-v1`n$CleanupToken`n"
            if (
              [IO.File]::ReadAllText($cleanupMarkerItem.FullName) -cne
                $expectedCleanupMarker
            ) {
              throw "protected process-evidence cleanup marker changed"
            }
          }

          function Get-ExpectedProcessEvidenceTree {
            param(
              [Parameter(Mandatory = $true)][string]$Path
            )

            $rootItem = Get-Item -LiteralPath $Path -Force -ErrorAction Stop
            if (
              -not $rootItem.PSIsContainer -or
              ($rootItem.Attributes -band
                [IO.FileAttributes]::ReparsePoint) -ne 0
            ) {
              throw "protected process-evidence tree root is invalid"
            }

            $expectedNames = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::OrdinalIgnoreCase
            )
            foreach ($name in @(
              "tmp",
              ".plurum-native-isolation",
              ".plurum-native-process-evidence-cleanup",
              "plurum-native-process-test-probe.exe",
              "plurum-native-process-evidence-harness.exe"
            )) {
              [void]$expectedNames.Add($name)
            }

            $children = @(
              Get-ChildItem `
                -LiteralPath $rootItem.FullName `
                -Force `
                -ErrorAction Stop
            )
            if ($children.Count -ne $expectedNames.Count) {
              throw "protected process-evidence tree contains unexpected entries"
            }
            foreach ($child in $children) {
              if (
                -not $expectedNames.Contains($child.Name) -or
                ($child.Attributes -band
                  [IO.FileAttributes]::ReparsePoint) -ne 0
              ) {
                throw "protected process-evidence tree contains an unsafe entry"
              }
            }

            $temporaryItem = Get-Item `
              -LiteralPath (Join-Path $rootItem.FullName "tmp") `
              -Force `
              -ErrorAction Stop
            if (
              -not $temporaryItem.PSIsContainer -or
              @(
                Get-ChildItem `
                  -LiteralPath $temporaryItem.FullName `
                  -Force `
                  -ErrorAction Stop
              ).Count -ne 0
            ) {
              throw "protected process-evidence temporary directory is not empty"
            }

            return @($rootItem) + $children
          }

          function Assert-AccountSidAbsentFromAcl {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$AccountSid
            )

            $acl = Get-Acl -LiteralPath $Path
            $rules = $acl.GetAccessRules(
              $true,
              $true,
              [Security.Principal.SecurityIdentifier]
            )
            if (
              @(
                $rules |
                  Where-Object {
                    $_.IdentityReference.Value -ceq $AccountSid
                  }
              ).Count -ne 0
            ) {
              throw "disposable account SID survived ACL cleanup"
            }
          }

          $runnerTemporaryItem = Get-Item -LiteralPath $env:RUNNER_TEMP -Force
          $isolationRootItem = Get-Item -LiteralPath $env:PLURUM_NATIVE_ISOLATION_ROOT -Force
          if (
            -not $runnerTemporaryItem.PSIsContainer -or
            ($runnerTemporaryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not $isolationRootItem.PSIsContainer -or
            ($isolationRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
            throw "Windows runtime evidence root directories are invalid"
          }
          $runnerTemporary = $runnerTemporaryItem.FullName
          $isolationRoot = $isolationRootItem.FullName
          if (
            [IO.Path]::GetFileName($isolationRoot) -cne "plurum-native-isolation" -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              [IO.Path]::GetDirectoryName($isolationRoot),
              $runnerTemporary
            )
          ) {
            throw "Windows runtime evidence isolation root is invalid"
          }
          $marker = Join-Path $isolationRoot ".plurum-native-isolation"
          $markerItem = Get-Item -LiteralPath $marker -Force
          if (
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              [IO.Path]::GetDirectoryName($markerItem.FullName),
              $isolationRoot
            ) -or
            ($markerItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            [IO.File]::ReadAllText($markerItem.FullName) -cne "plurum-native-isolation-v1`n"
          ) {
            throw "Windows runtime evidence isolation marker is invalid"
          }

          $cargoTargetItem = Get-Item -LiteralPath $env:CARGO_TARGET_DIR -Force
          if (
            -not $cargoTargetItem.PSIsContainer -or
            ($cargoTargetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
            throw "Windows runtime evidence Cargo target is invalid"
          }
          $cargoTarget = $cargoTargetItem.FullName
          if (
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              $cargoTarget,
              (Join-Path $isolationRoot "cargo-target")
            )
          ) {
            throw "Windows runtime evidence Cargo target is invalid"
          }
          $releaseDirectoryItem = Get-Item -LiteralPath (Join-Path $cargoTarget "release") -Force
          if (
            -not $releaseDirectoryItem.PSIsContainer -or
            ($releaseDirectoryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              [IO.Path]::GetDirectoryName($releaseDirectoryItem.FullName),
              $cargoTarget
            )
          ) {
            throw "Windows runtime evidence release directory is invalid"
          }
          $probe = Join-Path $releaseDirectoryItem.FullName "plurum-runtime-identity-test-probe.exe"
          $probeItem = Get-Item -LiteralPath $probe -Force
          if (
            $probeItem.PSIsContainer -or
            ($probeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
            throw "Windows runtime evidence probe is invalid"
          }

          $neutralDirectoryItem = Get-Item -LiteralPath (Join-Path $isolationRoot "tmp") -Force
          if (
            -not $neutralDirectoryItem.PSIsContainer -or
            ($neutralDirectoryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              [IO.Path]::GetDirectoryName($neutralDirectoryItem.FullName),
              $isolationRoot
            )
          ) {
            throw "Windows runtime evidence neutral directory is invalid"
          }

          $processEvidenceManifestItem = Get-ValidatedDescendantItem `
            -Root $isolationRoot `
            -Candidate $env:PLURUM_NATIVE_PROCESS_EVIDENCE_MANIFEST `
            -Directory $false `
            -Label "native process evidence manifest"
          if (
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              $processEvidenceManifestItem.FullName,
              (Join-Path `
                $neutralDirectoryItem.FullName `
                ".plurum-native-process-evidence-manifest-v1.json")
            )
          ) {
            throw "native process evidence manifest path is invalid"
          }
          $processEvidenceManifest = Get-Content `
            -LiteralPath $processEvidenceManifestItem.FullName `
            -Raw |
              ConvertFrom-Json -Depth 16
          if (
            $processEvidenceManifest.version -ne 1 -or
            $processEvidenceManifest.marker -cne
              "plurum-native-process-evidence-manifest-v1" -or
            $processEvidenceManifest.platform -cne "win32" -or
            $processEvidenceManifest.arch -cne "x64" -or
            $processEvidenceManifest.rustHost -cne
              "x86_64-pc-windows-msvc" -or
            $processEvidenceManifest.toolchain -cne "1.97.1" -or
            $processEvidenceManifest.probeLayout.kind -cne "thin" -or
            @($processEvidenceManifest.probeLayout.rustTargets).Count -ne 1 -or
            $processEvidenceManifest.probeLayout.rustTargets[0] -cne
              "x86_64-pc-windows-msvc" -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              $processEvidenceManifest.cargoTarget,
              $cargoTarget
            ) -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              $processEvidenceManifest.probe.path,
              $env:PLURUM_NATIVE_PROCESS_PROBE_PATH
            ) -or
            $processEvidenceManifest.probe.sha256 -cne
              $env:PLURUM_NATIVE_PROCESS_PROBE_SHA256 -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              $processEvidenceManifest.harness.path,
              $env:PLURUM_NATIVE_PROCESS_HARNESS_PATH
            ) -or
            $processEvidenceManifest.harness.sha256 -cne
              $env:PLURUM_NATIVE_PROCESS_HARNESS_SHA256
          ) {
            throw "native process evidence manifest did not survive GITHUB_ENV"
          }

          $sourceProcessProbeItem = Get-ValidatedDescendantItem `
            -Root $cargoTarget `
            -Candidate $env:PLURUM_NATIVE_PROCESS_PROBE_PATH `
            -Directory $false `
            -Label "native process evidence probe"
          $sourceProcessHarnessItem = Get-ValidatedDescendantItem `
            -Root $cargoTarget `
            -Candidate $env:PLURUM_NATIVE_PROCESS_HARNESS_PATH `
            -Directory $false `
            -Label "native process evidence harness"
          if (
            [StringComparer]::OrdinalIgnoreCase.Equals(
              $sourceProcessProbeItem.FullName,
              $sourceProcessHarnessItem.FullName
            ) -or
            $sourceProcessProbeItem.Length -le 0 -or
            $sourceProcessHarnessItem.Length -le 0 -or
            $sourceProcessProbeItem.Length.ToString() -cne
              $processEvidenceManifest.probe.size -or
            $sourceProcessHarnessItem.Length.ToString() -cne
              $processEvidenceManifest.harness.size
          ) {
            throw "native process evidence artifacts are invalid"
          }
          Assert-ArtifactHash `
            -Item $sourceProcessProbeItem `
            -Expected $env:PLURUM_NATIVE_PROCESS_PROBE_SHA256 `
            -Label "native process evidence probe"
          Assert-ArtifactHash `
            -Item $sourceProcessHarnessItem `
            -Expected $env:PLURUM_NATIVE_PROCESS_HARNESS_SHA256 `
            -Label "native process evidence harness"

          foreach ($mode in @(
            "ambient-elevated-rejected",
            "lowered-elevated-rejected"
          )) {
            $probeProcess = $null
            try {
              $probeStartInfo = [Diagnostics.ProcessStartInfo]::new()
              $probeStartInfo.FileName = $probeItem.FullName
              $probeStartInfo.ArgumentList.Add($mode)
              $probeStartInfo.WorkingDirectory = $neutralDirectoryItem.FullName
              $probeStartInfo.UseShellExecute = $false
              $probeStartInfo.CreateNoWindow = $true
              $probeStartInfo.Environment.Clear()
              $probeStartInfo.Environment["SystemRoot"] = $env:SystemRoot
              $probeStartInfo.Environment["WINDIR"] = $env:WINDIR
              $probeStartInfo.Environment["TEMP"] = $neutralDirectoryItem.FullName
              $probeStartInfo.Environment["TMP"] = $neutralDirectoryItem.FullName
              $probeProcess = [Diagnostics.Process]::Start($probeStartInfo)
              if (-not $probeProcess.WaitForExit(60000)) {
                $probeProcess.Kill($true)
                if (-not $probeProcess.WaitForExit(15000)) {
                  throw "elevated runtime evidence did not terminate after its bound"
                }
                throw "elevated runtime evidence timed out"
              }
              if ($probeProcess.ExitCode -ne 0) {
                throw "Windows runtime evidence probe failed"
              }
            }
            finally {
              if ($null -ne $probeProcess) {
                if (-not $probeProcess.HasExited) {
                  $probeProcess.Kill($true)
                  if (-not $probeProcess.WaitForExit(15000)) {
                    throw "elevated runtime evidence cleanup timed out"
                  }
                }
                $probeProcess.Dispose()
              }
            }
          }

          $systemRootItem = Get-Item -LiteralPath $env:SystemRoot -Force
          $system32Item = Get-Item `
            -LiteralPath (Join-Path $systemRootItem.FullName "System32") `
            -Force
          $icaclsItem = Get-Item `
            -LiteralPath (Join-Path $system32Item.FullName "icacls.exe") `
            -Force
          if (
            -not $systemRootItem.PSIsContainer -or
            ($systemRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not $system32Item.PSIsContainer -or
            ($system32Item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            $icaclsItem.PSIsContainer -or
            ($icaclsItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
            throw "Windows runtime evidence ACL tool is invalid"
          }

          $fixedDriveRoot = [IO.Path]::GetPathRoot($systemRootItem.FullName)
          $fixedDriveRootItem = Get-Item -LiteralPath $fixedDriveRoot -Force
          $fixedDrive = [IO.DriveInfo]::new($fixedDriveRoot)
          if (
            -not $fixedDriveRootItem.PSIsContainer -or
            ($fixedDriveRootItem.Attributes -band
              [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not $fixedDrive.IsReady -or
            $fixedDrive.DriveType -ne [IO.DriveType]::Fixed -or
            $fixedDrive.DriveFormat -cne "NTFS" -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              $fixedDrive.RootDirectory.FullName,
              $fixedDriveRootItem.FullName
            )
          ) {
            throw "Windows process evidence requires the local fixed NTFS system drive"
          }

          $accountName = "plurum" + [Guid]::NewGuid().ToString("N").Substring(0, 8)
          $randomBytes = [byte[]]::new(32)
          [Security.Cryptography.RandomNumberGenerator]::Fill($randomBytes)
          $passwordText = "Aa1!" + [Convert]::ToBase64String($randomBytes)
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $securePassword.MakeReadOnly()
          [Array]::Clear($randomBytes, 0, $randomBytes.Length)
          $passwordText = $null

          $accountCreated = $false
          $evidenceDirectory = Join-Path $isolationRoot "windows-runtime-identity"
          $runtimeEvidenceCleanupToken = [Guid]::NewGuid().ToString("N")
          $runtimeEvidenceProbeHash = $null
          $runtimeEvidenceProbeSize = 0
          $processEvidenceRoot = Join-Path $fixedDriveRoot "plurum-native-isolation"
          $processEvidenceRootCreated = $false
          $processEvidenceCleanupToken = [Guid]::NewGuid().ToString("N")
          $accountSid = $null
          $activeProcess = $null
          $processEvidenceQuiescent = $true
          $primaryFailure = $null
          $cleanupFailures = [Collections.Generic.List[Exception]]::new()
          try {
            $accountExpiration = (Get-Date).AddHours(1)
            $account = New-LocalUser `
              -Name $accountName `
              -Password $securePassword `
              -AccountExpires $accountExpiration `
              -PasswordNeverExpires `
              -UserMayNotChangePassword
            $accountCreated = $true
            $accountSid = $account.SID.Value
            $administratorGroup = Get-LocalGroup -SID "S-1-5-32-544"
            $administratorSids = @(
              Get-LocalGroupMember -Group $administratorGroup.Name |
                ForEach-Object { $_.SID.Value }
            )
            if ($administratorSids -contains $accountSid) {
              throw "disposable runtime-evidence account is unexpectedly an administrator"
            }

            $evidenceDirectoryItem = New-Item `
              -ItemType Directory `
              -Path $evidenceDirectory
            if (
              -not $evidenceDirectoryItem.PSIsContainer -or
              ($evidenceDirectoryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetDirectoryName($evidenceDirectoryItem.FullName),
                $isolationRoot
              )
            ) {
              throw "disposable runtime-evidence directory is invalid"
            }
            $stagedProbe = Join-Path $evidenceDirectory "runtime-identity-probe.exe"
            Copy-Item -LiteralPath $probeItem.FullName -Destination $stagedProbe
            $stagedProbeItem = Get-Item -LiteralPath $stagedProbe -Force
            if (
              $stagedProbeItem.PSIsContainer -or
              ($stagedProbeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetDirectoryName($stagedProbeItem.FullName),
                $evidenceDirectoryItem.FullName
              )
            ) {
              throw "disposable runtime-evidence probe is invalid"
            }
            $runtimeEvidenceProbeHash = (
              Get-FileHash `
                -LiteralPath $probeItem.FullName `
                -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $runtimeEvidenceProbeSize = $probeItem.Length
            Assert-ArtifactHash `
              -Item $stagedProbeItem `
              -Expected $runtimeEvidenceProbeHash `
              -Label "staged runtime-identity evidence probe"
            if ($stagedProbeItem.Length -ne $runtimeEvidenceProbeSize) {
              throw "staged runtime-identity evidence probe size changed"
            }
            $runtimeEvidenceCleanupMarker = Join-Path `
              $evidenceDirectory `
              ".plurum-windows-runtime-identity-cleanup"
            $utf8WithoutBom = [Text.UTF8Encoding]::new($false, $true)
            [IO.File]::WriteAllText(
              $runtimeEvidenceCleanupMarker,
              "plurum-windows-runtime-identity-cleanup-v1`n$runtimeEvidenceCleanupToken`n",
              $utf8WithoutBom
            )
            & $icaclsItem.FullName $isolationRoot /grant "*$accountSid`:(RX)" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to grant disposable isolation-root traversal"
            }
            $runtimeEvidenceAclArguments = @(
              $evidenceDirectory,
              "/inheritance:r",
              "/grant:r",
              "*$accountSid`:(OI)(CI)(RX)",
              "*S-1-5-18:(OI)(CI)(F)",
              "*S-1-5-32-544:(OI)(CI)(F)",
              "/T",
              "/L"
            )
            & $icaclsItem.FullName @runtimeEvidenceAclArguments | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to protect runtime-identity evidence ACLs"
            }
            & $icaclsItem.FullName `
              $evidenceDirectory `
              /setowner "*S-1-5-32-544" `
              /T `
              /L |
                Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to bind runtime-identity evidence ownership"
            }
            [void](Get-RuntimeIdentityEvidenceCleanupTree `
              -Path $evidenceDirectory `
              -IsolationRoot $isolationRoot `
              -CleanupToken $runtimeEvidenceCleanupToken `
              -ExpectedProbeHash $runtimeEvidenceProbeHash `
              -ExpectedProbeSize $runtimeEvidenceProbeSize `
              -AccountSid $accountSid)

            foreach ($mode in @(
              "standard-default-stable",
              "self-impersonation-rejected",
              "standard-token-change-conflict"
            )) {
              $startInfo = [Diagnostics.ProcessStartInfo]::new()
              $startInfo.FileName = $stagedProbeItem.FullName
              $startInfo.ArgumentList.Add($mode)
              $startInfo.WorkingDirectory = $evidenceDirectory
              $startInfo.UseShellExecute = $false
              $startInfo.CreateNoWindow = $true
              $startInfo.LoadUserProfile = $false
              $startInfo.UserName = $accountName
              $startInfo.Domain = $env:COMPUTERNAME
              $startInfo.Password = $securePassword
              $startInfo.Environment.Clear()
              $startInfo.Environment["SystemRoot"] = $env:SystemRoot
              $startInfo.Environment["WINDIR"] = $env:WINDIR
              $startInfo.Environment["TEMP"] = $evidenceDirectory
              $startInfo.Environment["TMP"] = $evidenceDirectory
              $activeProcess = [Diagnostics.Process]::Start($startInfo)
              if (-not $activeProcess.WaitForExit(60000)) {
                $activeProcess.Kill($true)
                if (-not $activeProcess.WaitForExit(15000)) {
                  throw "standard-user runtime evidence did not terminate after its bound"
                }
                throw "standard-user runtime evidence timed out"
              }
              if ($activeProcess.ExitCode -ne 0) {
                throw "genuine standard-user runtime evidence failed"
              }
              $activeProcess.Dispose()
              $activeProcess = $null
            }

            if (Test-Path -LiteralPath $processEvidenceRoot) {
              throw "protected process-evidence root already exists"
            }
            $processEvidenceRootItem = New-Item `
              -ItemType Directory `
              -Path $processEvidenceRoot
            $processEvidenceRootCreated = $true
            if (
              -not $processEvidenceRootItem.PSIsContainer -or
              ($processEvidenceRootItem.Attributes -band
                [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetDirectoryName(
                  $processEvidenceRootItem.FullName
                ),
                $fixedDriveRoot
              ) -or
              [IO.Path]::GetFileName(
                $processEvidenceRootItem.FullName
              ) -cne "plurum-native-isolation"
            ) {
              throw "protected process-evidence root was not a direct drive child"
            }

            $processEvidenceTemporaryItem = New-Item `
              -ItemType Directory `
              -Path (Join-Path $processEvidenceRoot "tmp")
            $isolationMarkerPath = Join-Path `
              $processEvidenceRoot `
              ".plurum-native-isolation"
            $cleanupMarkerPath = Join-Path `
              $processEvidenceRoot `
              ".plurum-native-process-evidence-cleanup"
            $utf8WithoutBom = [Text.UTF8Encoding]::new($false, $true)
            [IO.File]::WriteAllText(
              $isolationMarkerPath,
              "plurum-native-isolation-v1`n",
              $utf8WithoutBom
            )
            [IO.File]::WriteAllText(
              $cleanupMarkerPath,
              "plurum-native-process-evidence-cleanup-v1`n$processEvidenceCleanupToken`n",
              $utf8WithoutBom
            )

            Assert-ArtifactHash `
              -Item $sourceProcessProbeItem `
              -Expected $env:PLURUM_NATIVE_PROCESS_PROBE_SHA256 `
              -Label "source native process evidence probe"
            Assert-ArtifactHash `
              -Item $sourceProcessHarnessItem `
              -Expected $env:PLURUM_NATIVE_PROCESS_HARNESS_SHA256 `
              -Label "source native process evidence harness"
            $stagedProcessProbe = Join-Path `
              $processEvidenceRoot `
              "plurum-native-process-test-probe.exe"
            $stagedProcessHarness = Join-Path `
              $processEvidenceRoot `
              "plurum-native-process-evidence-harness.exe"
            Copy-Item `
              -LiteralPath $sourceProcessProbeItem.FullName `
              -Destination $stagedProcessProbe
            Copy-Item `
              -LiteralPath $sourceProcessHarnessItem.FullName `
              -Destination $stagedProcessHarness

            $stagedProcessProbeItem = Get-ValidatedDescendantItem `
              -Root $processEvidenceRoot `
              -Candidate $stagedProcessProbe `
              -Directory $false `
              -Label "staged native process evidence probe"
            $stagedProcessHarnessItem = Get-ValidatedDescendantItem `
              -Root $processEvidenceRoot `
              -Candidate $stagedProcessHarness `
              -Directory $false `
              -Label "staged native process evidence harness"
            if (
              $stagedProcessProbeItem.Length -ne
                $sourceProcessProbeItem.Length -or
              $stagedProcessHarnessItem.Length -ne
                $sourceProcessHarnessItem.Length
            ) {
              throw "staged native process evidence artifact sizes changed"
            }
            Assert-ArtifactHash `
              -Item $stagedProcessProbeItem `
              -Expected $env:PLURUM_NATIVE_PROCESS_PROBE_SHA256 `
              -Label "staged native process evidence probe"
            Assert-ArtifactHash `
              -Item $stagedProcessHarnessItem `
              -Expected $env:PLURUM_NATIVE_PROCESS_HARNESS_SHA256 `
              -Label "staged native process evidence harness"

            $processEvidenceAclArguments = @(
              $processEvidenceRoot,
              "/inheritance:r",
              "/grant:r",
              "*$accountSid`:(OI)(CI)(F)",
              "*S-1-5-18:(OI)(CI)(F)",
              "*S-1-5-32-544:(OI)(CI)(F)",
              "/T",
              "/L"
            )
            [void](Get-ExpectedProcessEvidenceTree -Path $processEvidenceRoot)
            & $icaclsItem.FullName @processEvidenceAclArguments | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to protect native process evidence ACLs"
            }
            & $icaclsItem.FullName `
              $processEvidenceRoot `
              /setowner "*$accountSid" `
              /T `
              /L |
                Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to bind native process evidence ownership"
            }

            foreach ($protectedPath in @(
              $processEvidenceRoot,
              $processEvidenceTemporaryItem.FullName,
              $isolationMarkerPath,
              $cleanupMarkerPath,
              $stagedProcessProbeItem.FullName,
              $stagedProcessHarnessItem.FullName
            )) {
              Assert-TrustedProcessEvidenceAcl `
                -Path $protectedPath `
                -AccountSid $accountSid
            }
            Assert-ProcessEvidenceCleanupRoot `
              -Path $processEvidenceRoot `
              -FixedDriveRoot $fixedDriveRoot `
              -CleanupToken $processEvidenceCleanupToken

            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $stagedProcessHarnessItem.FullName
            $startInfo.ArgumentList.Add(
              "runtime::supervisor::tests::native_process_evidence"
            )
            $startInfo.ArgumentList.Add("--exact")
            $startInfo.ArgumentList.Add("--ignored")
            $startInfo.ArgumentList.Add("--test-threads=1")
            $startInfo.WorkingDirectory = $processEvidenceRoot
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.LoadUserProfile = $false
            $startInfo.UserName = $accountName
            $startInfo.Domain = $env:COMPUTERNAME
            $startInfo.Password = $securePassword
            $startInfo.Environment.Clear()
            $startInfo.Environment["SystemRoot"] = $env:SystemRoot
            $startInfo.Environment["WINDIR"] = $env:WINDIR
            $startInfo.Environment["TEMP"] =
              $processEvidenceTemporaryItem.FullName
            $startInfo.Environment["TMP"] =
              $processEvidenceTemporaryItem.FullName
            $startInfo.Environment["NO_COLOR"] = "1"
            $startInfo.Environment["PLURUM_NATIVE_ISOLATION_ROOT"] =
              $processEvidenceRoot
            $startInfo.Environment["PLURUM_NATIVE_PROCESS_TEST_PROBE"] =
              $stagedProcessProbeItem.FullName
            $startInfo.Environment[
              "PLURUM_NATIVE_PROCESS_EVIDENCE_SENTINEL"
            ] = "plurum-native-process-evidence-run-v1"
            $activeProcess = [Diagnostics.Process]::Start($startInfo)
            $processEvidenceQuiescent = $false
            if (-not $activeProcess.WaitForExit(300000)) {
              $activeProcess.Kill($true)
              if (-not $activeProcess.WaitForExit(15000)) {
                throw "native process evidence did not terminate after its bound"
              }
              throw "native process evidence timed out"
            }
            $processEvidenceExitCode = $activeProcess.ExitCode
            $activeProcess.Dispose()
            $activeProcess = $null
            Disable-And-ProveDisposableAccountQuiescent `
              -AccountSid $accountSid `
              -AccountName $accountName
            $processEvidenceQuiescent = $true
            if ($processEvidenceExitCode -ne 0) {
              throw "genuine standard-user native process evidence failed"
            }

            Assert-ArtifactHash `
              -Item $sourceProcessProbeItem `
              -Expected $env:PLURUM_NATIVE_PROCESS_PROBE_SHA256 `
              -Label "source native process evidence probe after execution"
            Assert-ArtifactHash `
              -Item $sourceProcessHarnessItem `
              -Expected $env:PLURUM_NATIVE_PROCESS_HARNESS_SHA256 `
              -Label "source native process evidence harness after execution"
            Assert-ArtifactHash `
              -Item $stagedProcessProbeItem `
              -Expected $env:PLURUM_NATIVE_PROCESS_PROBE_SHA256 `
              -Label "staged native process evidence probe after execution"
            Assert-ArtifactHash `
              -Item $stagedProcessHarnessItem `
              -Expected $env:PLURUM_NATIVE_PROCESS_HARNESS_SHA256 `
              -Label "staged native process evidence harness after execution"
            Assert-ProcessEvidenceCleanupRoot `
              -Path $processEvidenceRoot `
              -FixedDriveRoot $fixedDriveRoot `
              -CleanupToken $processEvidenceCleanupToken
          }
          catch {
            $primaryFailure = $_.Exception
          }
          finally {
            if ($null -ne $activeProcess) {
              try {
                if (-not $activeProcess.HasExited) {
                  $activeProcess.Kill($true)
                  if (-not $activeProcess.WaitForExit(15000)) {
                    throw "evidence process did not terminate during bounded cleanup"
                  }
                }
              }
              catch {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "standard-user probe cleanup failed",
                    $_.Exception
                  )
                )
              }
              finally {
                try {
                  $activeProcess.Dispose()
                }
                catch {
                  $cleanupFailures.Add(
                    [InvalidOperationException]::new(
                      "standard-user process handle cleanup failed",
                      $_.Exception
                    )
                  )
                }
                $activeProcess = $null
              }
            }
            if ($null -ne $accountSid) {
              $processEvidenceQuiescent = $false
              try {
                Disable-And-ProveDisposableAccountQuiescent `
                  -AccountSid $accountSid `
                  -AccountName $accountName
                $processEvidenceQuiescent = $true
              }
              catch {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "disposable-account quiescence proof failed",
                    $_.Exception
                  )
                )
              }
            }
            if ($processEvidenceRootCreated) {
              if (-not $processEvidenceQuiescent) {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "protected process-evidence cleanup was refused because the process did not stop"
                  )
                )
              }
              else {
                try {
                  Assert-ProcessEvidenceCleanupRoot `
                    -Path $processEvidenceRoot `
                    -FixedDriveRoot $fixedDriveRoot `
                    -CleanupToken $processEvidenceCleanupToken
                  $cleanupTree = @(
                    Get-ExpectedProcessEvidenceTree -Path $processEvidenceRoot
                  )
                  foreach ($cleanupItem in $cleanupTree) {
                    Assert-TrustedProcessEvidenceAcl `
                      -Path $cleanupItem.FullName `
                      -AccountSid $accountSid
                  }

                  $cleanupProbeItem = Get-ValidatedDescendantItem `
                    -Root $processEvidenceRoot `
                    -Candidate (Join-Path `
                      $processEvidenceRoot `
                      "plurum-native-process-test-probe.exe") `
                    -Directory $false `
                    -Label "cleanup native process evidence probe"
                  $cleanupHarnessItem = Get-ValidatedDescendantItem `
                    -Root $processEvidenceRoot `
                    -Candidate (Join-Path `
                      $processEvidenceRoot `
                      "plurum-native-process-evidence-harness.exe") `
                    -Directory $false `
                    -Label "cleanup native process evidence harness"
                  Assert-ArtifactHash `
                    -Item $cleanupProbeItem `
                    -Expected $env:PLURUM_NATIVE_PROCESS_PROBE_SHA256 `
                    -Label "cleanup native process evidence probe"
                  Assert-ArtifactHash `
                    -Item $cleanupHarnessItem `
                    -Expected $env:PLURUM_NATIVE_PROCESS_HARNESS_SHA256 `
                    -Label "cleanup native process evidence harness"

                  foreach ($cleanupPath in @(
                    $cleanupProbeItem.FullName,
                    $cleanupHarnessItem.FullName,
                    (Join-Path $processEvidenceRoot ".plurum-native-isolation"),
                    (Join-Path `
                      $processEvidenceRoot `
                      ".plurum-native-process-evidence-cleanup")
                  )) {
                    Remove-Item -LiteralPath $cleanupPath -Force
                    if (Test-Path -LiteralPath $cleanupPath) {
                      throw "protected process-evidence file survived cleanup"
                    }
                  }
                  $cleanupTemporary = Join-Path $processEvidenceRoot "tmp"
                  Remove-Item -LiteralPath $cleanupTemporary -Force
                  if (Test-Path -LiteralPath $cleanupTemporary) {
                    throw "protected process-evidence temporary directory survived cleanup"
                  }
                  Remove-Item -LiteralPath $processEvidenceRoot -Force
                  if (Test-Path -LiteralPath $processEvidenceRoot) {
                    throw "protected process-evidence root survived cleanup"
                  }
                }
                catch {
                  $cleanupFailures.Add(
                    [InvalidOperationException]::new(
                      "protected process-evidence cleanup failed",
                      $_.Exception
                    )
                  )
                }
              }
            }
            if (Test-Path -LiteralPath $evidenceDirectory) {
              if (-not $processEvidenceQuiescent) {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "runtime-identity evidence cleanup was refused because account quiescence was not proved"
                  )
                )
              }
              else {
                try {
                  $runtimeCleanup =
                    Get-RuntimeIdentityEvidenceCleanupTree `
                      -Path $evidenceDirectory `
                      -IsolationRoot $isolationRoot `
                      -CleanupToken $runtimeEvidenceCleanupToken `
                      -ExpectedProbeHash $runtimeEvidenceProbeHash `
                      -ExpectedProbeSize $runtimeEvidenceProbeSize `
                      -AccountSid $accountSid
                  Remove-Item `
                    -LiteralPath $runtimeCleanup.Probe.FullName `
                    -Force
                  if (
                    Test-Path -LiteralPath $runtimeCleanup.Probe.FullName
                  ) {
                    throw "runtime-identity evidence probe survived cleanup"
                  }
                  Remove-Item `
                    -LiteralPath $runtimeCleanup.Marker.FullName `
                    -Force
                  if (
                    Test-Path -LiteralPath $runtimeCleanup.Marker.FullName
                  ) {
                    throw "runtime-identity evidence marker survived cleanup"
                  }
                  if (
                    @(
                      Get-ChildItem `
                        -LiteralPath $runtimeCleanup.Root.FullName `
                        -Force `
                        -ErrorAction Stop
                    ).Count -ne 0
                  ) {
                    throw "runtime-identity evidence root was not empty"
                  }
                  Remove-Item `
                    -LiteralPath $runtimeCleanup.Root.FullName `
                    -Force
                  if (
                    Test-Path -LiteralPath $runtimeCleanup.Root.FullName
                  ) {
                    throw "runtime-identity evidence root survived cleanup"
                  }
                }
                catch {
                  $cleanupFailures.Add(
                    [InvalidOperationException]::new(
                      "runtime-identity evidence cleanup failed",
                      $_.Exception
                    )
                  )
                }
              }
            }
            if ($null -ne $accountSid) {
              if (-not $processEvidenceQuiescent) {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "isolation-root ACL cleanup was refused because account quiescence was not proved"
                  )
                )
              }
              else {
                try {
                  & $icaclsItem.FullName `
                    $isolationRoot `
                    /remove:g "*$accountSid" |
                      Out-Null
                  if ($LASTEXITCODE -ne 0) {
                    throw "icacls failed"
                  }
                  Assert-AccountSidAbsentFromAcl `
                    -Path $isolationRoot `
                    -AccountSid $accountSid
                }
                catch {
                  $cleanupFailures.Add(
                    [InvalidOperationException]::new(
                      "isolation-root ACL cleanup failed",
                      $_.Exception
                    )
                  )
                }
              }
            }
            if ($accountCreated) {
              if (-not $processEvidenceQuiescent) {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "disposable-account removal was refused because quiescence was not proved"
                  )
                )
              }
              else {
                try {
                  Disable-And-ProveDisposableAccountQuiescent `
                    -AccountSid $accountSid `
                    -AccountName $accountName
                  $accountSidObject =
                    [Security.Principal.SecurityIdentifier]::new($accountSid)
                  Remove-LocalUser -SID $accountSidObject
                  $remainingAccounts = @(
                    Get-LocalUser -ErrorAction Stop |
                      Where-Object {
                        $null -ne $_.SID -and
                        $_.SID.Equals($accountSidObject)
                      }
                  )
                  if ($remainingAccounts.Count -ne 0) {
                    throw "disposable account survived removal"
                  }
                }
                catch {
                  $cleanupFailures.Add(
                    [InvalidOperationException]::new(
                      "disposable-account cleanup failed",
                      $_.Exception
                    )
                  )
                }
              }
            }
            try {
              $securePassword.Dispose()
            }
            catch {
              $cleanupFailures.Add(
                [InvalidOperationException]::new(
                  "disposable password cleanup failed",
                  $_.Exception
                )
              )
            }
          }
          if ($null -ne $primaryFailure -and $cleanupFailures.Count -eq 0) {
            throw $primaryFailure
          }
          if ($null -ne $primaryFailure) {
            $cleanupFailures.Insert(0, $primaryFailure)
          }
          if ($cleanupFailures.Count -ne 0) {
            throw [AggregateException]::new(
              "Windows runtime evidence or cleanup failed",
              [Exception[]]$cleanupFailures
            )
          }
      - name: Build the native foundation
        run: node native/credential-store/tests/run-isolated-cargo.mjs build
      - name: Verify the Node 22.12 ABI floor
        run: node native/credential-store/tests/abi-conformance.mjs
        env:
          PLURUM_NATIVE_EXPECTED_NODE: "22.12.0"
          PLURUM_NATIVE_EXPECTED_TARGET: ${{ matrix.target }}
      - name: Verify the Node 22.12 installed native package
        run: npm run verify-native-package
        env:
          PLURUM_NATIVE_EXPECTED_NODE: "22.12.0"
          PLURUM_NATIVE_EXPECTED_TARGET: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.0.0"
          architecture: ${{ matrix.architecture }}
      - name: Verify the Node 24 ABI
        run: node native/credential-store/tests/abi-conformance.mjs
        env:
          PLURUM_NATIVE_EXPECTED_NODE: "24.0.0"
          PLURUM_NATIVE_EXPECTED_TARGET: ${{ matrix.target }}
      - name: Verify the Node 24 installed native package
        run: npm run verify-native-package
        env:
          PLURUM_NATIVE_EXPECTED_NODE: "24.0.0"
          PLURUM_NATIVE_EXPECTED_TARGET: ${{ matrix.target }}
      - name: Recheck capability boundaries on Node 24
        run: npm run verify-capabilities
      - name: Recheck the npm package on Node 24
        run: npm run verify-package
      - name: Verify no native artifact entered the package tree
        run: node native/credential-store/tests/artifact-conformance.mjs
      - name: Verify tests generated no tracked changes
        run: git diff --exit-code
