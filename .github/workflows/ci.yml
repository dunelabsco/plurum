name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plurum_registration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plurum_registration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_DB_URL: postgresql://localhost/test
      SUPABASE_KEY: test-key
      OPENAI_API_KEY: test-key
      ENVIRONMENT: development
      PLURUM_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/plurum_registration_test
      PLURUM_ALLOW_DESTRUCTIVE_POSTGRES_TEST: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Lint
        run: poetry run ruff check app tests
      - name: Run backend and Hermes plugin tests
        run: poetry run pytest tests plugins/hermes/tests -q
      - name: Build production image
        run: docker build --tag plurum-ci .

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  openclaw:
    name: openclaw plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/openclaw
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/openclaw/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify tracked dist
        run: git diff --exit-code -- dist

  plurum-cli:
    name: plurum cli (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
          - os: macos-latest
            node: "22"
          - os: windows-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
    defaults:
      run:
        working-directory: packages/plurum-cli
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/plurum-cli/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test, build, and verify package
        run: npm run check

  native-credential-abi:
    name: native credential ABI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
            target: darwin-arm64
            rust_host: aarch64-apple-darwin
          - os: macos-15-intel
            architecture: x64
            target: darwin-x64
            rust_host: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            architecture: arm64
            target: linux-arm64-gnu
            rust_host: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            architecture: x64
            target: linux-x64-gnu
            rust_host: x86_64-unknown-linux-gnu
          - os: windows-2025
            architecture: x64
            target: win32-x64-msvc
            rust_host: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: packages/plurum-cli
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          architecture: ${{ matrix.architecture }}
      - name: Prepare isolated native test paths
        run: node native/credential-store/tests/prepare-isolation.mjs
        env:
          PLURUM_NATIVE_ISOLATION_ROOT: ${{ runner.temp }}/plurum-native-isolation
          PLURUM_NATIVE_RUST_HOST: ${{ matrix.rust_host }}
      - name: Install npm dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the unwired CLI package
        run: npm run check
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch locked Rust dependencies
        run: node native/credential-store/tests/run-isolated-cargo.mjs fetch
      - name: Verify locked Rust metadata and features
        run: node native/credential-store/tests/metadata-conformance.mjs
      - name: Install the declared minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check the declared Rust minimum
        run: node native/credential-store/tests/run-isolated-cargo.mjs msrv
      - name: Check Rust formatting
        run: node native/credential-store/tests/run-isolated-cargo.mjs fmt
      - name: Lint the native foundation
        run: node native/credential-store/tests/run-isolated-cargo.mjs clippy
      - name: Test the native foundation
        run: node native/credential-store/tests/run-isolated-cargo.mjs test
      - name: Build the test-only Windows launchers
        if: matrix.target == 'win32-x64-msvc'
        run: node native/credential-store/tests/run-isolated-cargo.mjs launcher
      - name: Verify native Windows runtime identity evidence
        if: matrix.target == 'win32-x64-msvc' && runner.environment == 'github-hosted'
        shell: pwsh
        env:
          PLURUM_WINDOWS_RUNTIME_EVIDENCE: github-windows-2025-x64-v1
        run: |
          $ErrorActionPreference = "Stop"
          if (
            $env:CI -cne "true" -or
            $env:GITHUB_ACTIONS -cne "true" -or
            $env:RUNNER_OS -cne "Windows" -or
            $env:RUNNER_ENVIRONMENT -cne "github-hosted" -or
            $env:PLURUM_NATIVE_RUST_HOST -cne "x86_64-pc-windows-msvc" -or
            $env:PLURUM_WINDOWS_RUNTIME_EVIDENCE -cne "github-windows-2025-x64-v1"
          ) {
            throw "Windows runtime evidence is restricted to the exact GitHub Actions row"
          }

          $runnerTemporaryItem = Get-Item -LiteralPath $env:RUNNER_TEMP -Force
          $isolationRootItem = Get-Item -LiteralPath $env:PLURUM_NATIVE_ISOLATION_ROOT -Force
          if (
            -not $runnerTemporaryItem.PSIsContainer -or
            ($runnerTemporaryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not $isolationRootItem.PSIsContainer -or
            ($isolationRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
            throw "Windows runtime evidence root directories are invalid"
          }
          $runnerTemporary = $runnerTemporaryItem.FullName
          $isolationRoot = $isolationRootItem.FullName
          if (
            [IO.Path]::GetFileName($isolationRoot) -cne "plurum-native-isolation" -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              [IO.Path]::GetDirectoryName($isolationRoot),
              $runnerTemporary
            )
          ) {
            throw "Windows runtime evidence isolation root is invalid"
          }
          $marker = Join-Path $isolationRoot ".plurum-native-isolation"
          $markerItem = Get-Item -LiteralPath $marker -Force
          if (
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              [IO.Path]::GetDirectoryName($markerItem.FullName),
              $isolationRoot
            ) -or
            ($markerItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            [IO.File]::ReadAllText($markerItem.FullName) -cne "plurum-native-isolation-v1`n"
          ) {
            throw "Windows runtime evidence isolation marker is invalid"
          }

          $cargoTargetItem = Get-Item -LiteralPath $env:CARGO_TARGET_DIR -Force
          if (
            -not $cargoTargetItem.PSIsContainer -or
            ($cargoTargetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
            throw "Windows runtime evidence Cargo target is invalid"
          }
          $cargoTarget = $cargoTargetItem.FullName
          if (
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              $cargoTarget,
              (Join-Path $isolationRoot "cargo-target")
            )
          ) {
            throw "Windows runtime evidence Cargo target is invalid"
          }
          $releaseDirectoryItem = Get-Item -LiteralPath (Join-Path $cargoTarget "release") -Force
          if (
            -not $releaseDirectoryItem.PSIsContainer -or
            ($releaseDirectoryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              [IO.Path]::GetDirectoryName($releaseDirectoryItem.FullName),
              $cargoTarget
            )
          ) {
            throw "Windows runtime evidence release directory is invalid"
          }
          $probe = Join-Path $releaseDirectoryItem.FullName "plurum-runtime-identity-test-probe.exe"
          $probeItem = Get-Item -LiteralPath $probe -Force
          if (
            $probeItem.PSIsContainer -or
            ($probeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
            throw "Windows runtime evidence probe is invalid"
          }

          $neutralDirectoryItem = Get-Item -LiteralPath (Join-Path $isolationRoot "tmp") -Force
          if (
            -not $neutralDirectoryItem.PSIsContainer -or
            ($neutralDirectoryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not [StringComparer]::OrdinalIgnoreCase.Equals(
              [IO.Path]::GetDirectoryName($neutralDirectoryItem.FullName),
              $isolationRoot
            )
          ) {
            throw "Windows runtime evidence neutral directory is invalid"
          }

          foreach ($mode in @(
            "ambient-elevated-rejected",
            "lowered-elevated-rejected"
          )) {
            $probeProcess = $null
            try {
              $probeStartInfo = [Diagnostics.ProcessStartInfo]::new()
              $probeStartInfo.FileName = $probeItem.FullName
              $probeStartInfo.ArgumentList.Add($mode)
              $probeStartInfo.WorkingDirectory = $neutralDirectoryItem.FullName
              $probeStartInfo.UseShellExecute = $false
              $probeStartInfo.CreateNoWindow = $true
              $probeStartInfo.Environment.Clear()
              $probeStartInfo.Environment["SystemRoot"] = $env:SystemRoot
              $probeStartInfo.Environment["WINDIR"] = $env:WINDIR
              $probeStartInfo.Environment["TEMP"] = $neutralDirectoryItem.FullName
              $probeStartInfo.Environment["TMP"] = $neutralDirectoryItem.FullName
              $probeProcess = [Diagnostics.Process]::Start($probeStartInfo)
              if (-not $probeProcess.WaitForExit(60000)) {
                $probeProcess.Kill($true)
                $probeProcess.WaitForExit()
                throw "elevated runtime evidence timed out"
              }
              if ($probeProcess.ExitCode -ne 0) {
                throw "Windows runtime evidence probe failed"
              }
            }
            finally {
              if ($null -ne $probeProcess) {
                if (-not $probeProcess.HasExited) {
                  $probeProcess.Kill($true)
                  $probeProcess.WaitForExit()
                }
                $probeProcess.Dispose()
              }
            }
          }

          $systemRootItem = Get-Item -LiteralPath $env:SystemRoot -Force
          $system32Item = Get-Item `
            -LiteralPath (Join-Path $systemRootItem.FullName "System32") `
            -Force
          $icaclsItem = Get-Item `
            -LiteralPath (Join-Path $system32Item.FullName "icacls.exe") `
            -Force
          if (
            -not $systemRootItem.PSIsContainer -or
            ($systemRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            -not $system32Item.PSIsContainer -or
            ($system32Item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
            $icaclsItem.PSIsContainer -or
            ($icaclsItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
          ) {
            throw "Windows runtime evidence ACL tool is invalid"
          }

          $accountName = "plurum" + [Guid]::NewGuid().ToString("N").Substring(0, 8)
          $randomBytes = [byte[]]::new(32)
          [Security.Cryptography.RandomNumberGenerator]::Fill($randomBytes)
          $passwordText = "Aa1!" + [Convert]::ToBase64String($randomBytes)
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $securePassword.MakeReadOnly()
          [Array]::Clear($randomBytes, 0, $randomBytes.Length)
          $passwordText = $null

          $accountCreated = $false
          $evidenceDirectory = Join-Path $isolationRoot "windows-runtime-identity"
          $accountSid = $null
          $activeProcess = $null
          $primaryFailure = $null
          $cleanupFailures = [Collections.Generic.List[Exception]]::new()
          try {
            $accountExpiration = (Get-Date).AddHours(1)
            $account = New-LocalUser `
              -Name $accountName `
              -Password $securePassword `
              -AccountExpires $accountExpiration `
              -PasswordNeverExpires `
              -UserMayNotChangePassword
            $accountCreated = $true
            $accountSid = $account.SID.Value
            $administratorGroup = Get-LocalGroup -SID "S-1-5-32-544"
            $administratorSids = @(
              Get-LocalGroupMember -Group $administratorGroup.Name |
                ForEach-Object { $_.SID.Value }
            )
            if ($administratorSids -contains $accountSid) {
              throw "disposable runtime-evidence account is unexpectedly an administrator"
            }

            $evidenceDirectoryItem = New-Item `
              -ItemType Directory `
              -Path $evidenceDirectory
            if (
              -not $evidenceDirectoryItem.PSIsContainer -or
              ($evidenceDirectoryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetDirectoryName($evidenceDirectoryItem.FullName),
                $isolationRoot
              )
            ) {
              throw "disposable runtime-evidence directory is invalid"
            }
            $stagedProbe = Join-Path $evidenceDirectory "runtime-identity-probe.exe"
            Copy-Item -LiteralPath $probeItem.FullName -Destination $stagedProbe
            $stagedProbeItem = Get-Item -LiteralPath $stagedProbe -Force
            if (
              $stagedProbeItem.PSIsContainer -or
              ($stagedProbeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              -not [StringComparer]::OrdinalIgnoreCase.Equals(
                [IO.Path]::GetDirectoryName($stagedProbeItem.FullName),
                $evidenceDirectoryItem.FullName
              )
            ) {
              throw "disposable runtime-evidence probe is invalid"
            }
            & $icaclsItem.FullName $isolationRoot /grant "*$accountSid`:(RX)" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to grant disposable isolation-root traversal"
            }
            & $icaclsItem.FullName $evidenceDirectory /grant "*$accountSid`:(OI)(CI)(RX)" | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "failed to grant disposable probe access"
            }

            foreach ($mode in @(
              "standard-default-stable",
              "self-impersonation-rejected",
              "standard-token-change-conflict"
            )) {
              $startInfo = [Diagnostics.ProcessStartInfo]::new()
              $startInfo.FileName = $stagedProbeItem.FullName
              $startInfo.ArgumentList.Add($mode)
              $startInfo.WorkingDirectory = $evidenceDirectory
              $startInfo.UseShellExecute = $false
              $startInfo.CreateNoWindow = $true
              $startInfo.LoadUserProfile = $false
              $startInfo.UserName = $accountName
              $startInfo.Domain = $env:COMPUTERNAME
              $startInfo.Password = $securePassword
              $startInfo.Environment.Clear()
              $startInfo.Environment["SystemRoot"] = $env:SystemRoot
              $startInfo.Environment["WINDIR"] = $env:WINDIR
              $startInfo.Environment["TEMP"] = $evidenceDirectory
              $startInfo.Environment["TMP"] = $evidenceDirectory
              $activeProcess = [Diagnostics.Process]::Start($startInfo)
              if (-not $activeProcess.WaitForExit(60000)) {
                $activeProcess.Kill($true)
                $activeProcess.WaitForExit()
                throw "standard-user runtime evidence timed out"
              }
              if ($activeProcess.ExitCode -ne 0) {
                throw "genuine standard-user runtime evidence failed"
              }
              $activeProcess.Dispose()
              $activeProcess = $null
            }
          }
          catch {
            $primaryFailure = $_.Exception
          }
          finally {
            if ($null -ne $activeProcess) {
              try {
                if (-not $activeProcess.HasExited) {
                  $activeProcess.Kill($true)
                  $activeProcess.WaitForExit()
                }
                $activeProcess.Dispose()
              }
              catch {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "standard-user probe cleanup failed",
                    $_.Exception
                  )
                )
              }
            }
            if ($null -ne $accountSid) {
              try {
                & $icaclsItem.FullName $isolationRoot /remove:g "*$accountSid" | Out-Null
                if ($LASTEXITCODE -ne 0) {
                  throw "icacls failed"
                }
              }
              catch {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "isolation-root ACL cleanup failed",
                    $_.Exception
                  )
                )
              }
            }
            try {
              if (Test-Path -LiteralPath $evidenceDirectory) {
                Remove-Item -LiteralPath $evidenceDirectory -Recurse -Force
              }
            }
            catch {
              $cleanupFailures.Add(
                [InvalidOperationException]::new(
                  "probe-directory cleanup failed",
                  $_.Exception
                )
              )
            }
            if ($accountCreated) {
              try {
                Remove-LocalUser -Name $accountName
              }
              catch {
                $cleanupFailures.Add(
                  [InvalidOperationException]::new(
                    "disposable-account cleanup failed",
                    $_.Exception
                  )
                )
              }
            }
            try {
              $securePassword.Dispose()
            }
            catch {
              $cleanupFailures.Add(
                [InvalidOperationException]::new(
                  "disposable password cleanup failed",
                  $_.Exception
                )
              )
            }
          }
          if ($null -ne $primaryFailure -and $cleanupFailures.Count -eq 0) {
            throw $primaryFailure
          }
          if ($null -ne $primaryFailure) {
            $cleanupFailures.Insert(0, $primaryFailure)
          }
          if ($cleanupFailures.Count -ne 0) {
            throw [AggregateException]::new(
              "Windows runtime evidence or cleanup failed",
              [Exception[]]$cleanupFailures
            )
          }
      - name: Build the native foundation
        run: node native/credential-store/tests/run-isolated-cargo.mjs build
      - name: Verify the Node 22.12 ABI floor
        run: node native/credential-store/tests/abi-conformance.mjs
        env:
          PLURUM_NATIVE_EXPECTED_NODE: "22.12.0"
          PLURUM_NATIVE_EXPECTED_TARGET: ${{ matrix.target }}
      - name: Verify the Node 22.12 installed native package
        run: npm run verify-native-package
        env:
          PLURUM_NATIVE_EXPECTED_NODE: "22.12.0"
          PLURUM_NATIVE_EXPECTED_TARGET: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.0.0"
          architecture: ${{ matrix.architecture }}
      - name: Verify the Node 24 ABI
        run: node native/credential-store/tests/abi-conformance.mjs
        env:
          PLURUM_NATIVE_EXPECTED_NODE: "24.0.0"
          PLURUM_NATIVE_EXPECTED_TARGET: ${{ matrix.target }}
      - name: Verify the Node 24 installed native package
        run: npm run verify-native-package
        env:
          PLURUM_NATIVE_EXPECTED_NODE: "24.0.0"
          PLURUM_NATIVE_EXPECTED_TARGET: ${{ matrix.target }}
      - name: Recheck capability boundaries on Node 24
        run: npm run verify-capabilities
      - name: Recheck the npm package on Node 24
        run: npm run verify-package
      - name: Verify no native artifact entered the package tree
        run: node native/credential-store/tests/artifact-conformance.mjs
      - name: Verify tests generated no tracked changes
        run: git diff --exit-code
